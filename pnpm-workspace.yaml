allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true

# 脆弱性対策の最低バージョン（package.json の pnpm.overrides は pnpm 11 で無視されるためここに置く）
overrides:
  'msgpackr@<1.10.1': '>=1.10.1'
  '@babel/traverse@<7.23.2': '>=7.23.2'
  'svelte@<4.2.19': '>=4.2.19 <5'
